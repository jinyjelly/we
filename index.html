<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>몸무게 기록</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f8fafc}*{box-sizing:border-box}body{margin:0}.app{max-width:720px;margin:auto;padding:20px 16px 48px}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:8px 0 20px}.head h1{font-size:28px;margin:0}.muted{color:#64748b;font-size:13px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat b{display:block;font-size:23px;margin-top:5px}.stat span{font-size:12px;color:#64748b}label{font-size:13px;font-weight:650;display:block}input{width:100%;font-size:17px;padding:13px;margin-top:6px;border:1px solid #cbd5e1;border-radius:12px;background:white}button,.fileBtn{border:0;border-radius:12px;padding:13px 15px;font-size:15px;font-weight:700;cursor:pointer}.primary{width:100%;background:#111827;color:white;margin-top:12px}.secondary{background:#eef2f7;color:#111827}.danger{background:#fff1f2;color:#be123c}.actions{display:flex;gap:8px;flex-wrap:wrap}.chart{width:100%;height:230px;display:block}.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #eef2f7}.row:first-child{border-top:0}.row .info{flex:1}.row strong{font-size:17px}.row small{display:block;color:#64748b;margin-top:3px}.mini{padding:9px 11px;font-size:13px}.empty{text-align:center;color:#64748b;padding:22px 0}.fileBtn input{display:none}@media(max-width:420px){.app{padding:14px 12px 40px}.head h1{font-size:25px}.card{border-radius:16px}.grid{gap:8px}.stat b{font-size:20px}}
</style>
</head>
<body><main class="app">
<div class="head"><div><h1>몸무게 기록</h1><div class="muted">매일 기록하고 변화를 확인하세요</div></div><div id="count" class="muted"></div></div>
<section class="card"><form id="form"><div class="grid"><label>날짜<input id="date" type="date" required></label><label>몸무게 (kg)<input id="weight" type="number" inputmode="decimal" step="0.1" min="20" max="400" placeholder="예: 68.4" required></label></div><button class="primary">기록하기</button></form><div id="msg" class="muted" style="margin-top:10px"></div></section>
<section class="grid"><div class="card stat"><span>최근 몸무게</span><b id="latest">—</b></div><div class="card stat"><span>직전 대비</span><b id="change">—</b></div><div class="card stat"><span>최근 7개 평균</span><b id="avg">—</b></div><div class="card stat"><span>첫 기록 대비</span><b id="total">—</b></div></section>
<section class="card"><b>변화 그래프</b><div class="muted" style="margin-top:3px">최근 30개 기록</div><svg id="chart" class="chart" viewBox="0 0 680 230" aria-label="몸무게 변화 그래프"></svg></section>
<section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><b>기록 내역</b><div class="muted">같은 날짜를 다시 입력하면 수정됩니다</div></div></div><div id="list"></div></section>
<section class="card"><b>백업</b><p class="muted">브라우저 데이터가 지워질 수 있으니 가끔 백업 파일을 저장해 두세요.</p><div class="actions"><button id="export" class="secondary" type="button">백업 내보내기</button><label class="fileBtn secondary">백업 불러오기<input id="import" type="file" accept="application/json"></label><button id="clear" class="danger" type="button">전체 삭제</button></div></section>
</main>
<script>
const KEY='weight-tracker-v1';let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){data=[]}
const $=s=>document.querySelector(s),date=$('#date'),weight=$('#weight'),msg=$('#msg');
const today=new Date(),p=n=>String(n).padStart(2,'0');date.value=`${today.getFullYear()}-${p(today.getMonth()+1)}-${p(today.getDate())}`;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function sorted(){return [...data].sort((a,b)=>a.date.localeCompare(b.date))}function sign(n){return `${n>0?'+':''}${n.toFixed(1)} kg`}function pretty(s){const [y,m,d]=s.split('-');return `${y}.${m}.${d}`}
function render(){const a=sorted(),last=a.at(-1),prev=a.at(-2);$('#count').textContent=`${a.length}일 기록`;$('#latest').textContent=last?`${last.weight.toFixed(1)} kg`:'—';$('#change').textContent=last&&prev?sign(last.weight-prev.weight):'—';const seven=a.slice(-7);$('#avg').textContent=seven.length?`${(seven.reduce((s,x)=>s+x.weight,0)/seven.length).toFixed(1)} kg`:'—';$('#total').textContent=a.length>1?sign(last.weight-a[0].weight):'—';
const list=$('#list');list.innerHTML=a.length?'':'<div class="empty">아직 기록이 없습니다.</div>';[...a].reverse().forEach(r=>{const i=a.findIndex(x=>x.date===r.date),before=i>0?a[i-1]:null,el=document.createElement('div');el.className='row';el.innerHTML=`<div class="info"><strong>${r.weight.toFixed(1)} kg</strong><small>${pretty(r.date)}${before?' · 직전 대비 '+sign(r.weight-before.weight):' · 첫 기록'}</small></div><button class="secondary mini edit">수정</button><button class="danger mini del">삭제</button>`;el.querySelector('.edit').onclick=()=>{date.value=r.date;weight.value=r.weight;weight.focus();msg.textContent='값을 바꾼 뒤 기록하기를 누르세요.'};el.querySelector('.del').onclick=()=>{data=data.filter(x=>x.date!==r.date);save();render()};list.appendChild(el)});draw(a.slice(-30))}
function draw(a){const svg=$('#chart');svg.innerHTML='';if(!a.length){svg.innerHTML='<text x="340" y="120" text-anchor="middle" fill="#94a3b8" font-size="14">기록을 추가하면 그래프가 표시됩니다</text>';return}const W=680,H=230,L=45,R=20,T=25,B=35,vals=a.map(x=>x.weight);let min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=1;max+=1}else{min-=.5;max+=.5}const x=i=>a.length===1?W/2:L+i*(W-L-R)/(a.length-1),y=v=>T+(max-v)*(H-T-B)/(max-min),ns='http://www.w3.org/2000/svg',mk=(tag,attrs)=>{const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));return e};for(let i=0;i<4;i++){const yy=T+i*(H-T-B)/3;svg.append(mk('line',{x1:L,y1:yy,x2:W-R,y2:yy,stroke:'#e2e8f0'}))}if(a.length>1)svg.append(mk('polyline',{points:a.map((d,i)=>`${x(i)},${y(d.weight)}`).join(' '),fill:'none',stroke:'#111827','stroke-width':3,'stroke-linecap':'round','stroke-linejoin':'round'}));a.forEach((d,i)=>{const c=mk('circle',{cx:x(i),cy:y(d.weight),r:5,fill:'#fff',stroke:'#111827','stroke-width':3});const t=document.createElementNS(ns,'title');t.textContent=`${pretty(d.date)} ${d.weight.toFixed(1)} kg`;c.append(t);svg.append(c)});const t1=mk('text',{x:L,y:H-8,fill:'#64748b','font-size':11});t1.textContent=pretty(a[0].date);svg.append(t1);if(a.length>1){const t2=mk('text',{x:W-R,y:H-8,fill:'#64748b','font-size':11,'text-anchor':'end'});t2.textContent=pretty(a.at(-1).date);svg.append(t2)}}
$('#form').onsubmit=e=>{e.preventDefault();const d=date.value,w=Number(weight.value);if(!d||!Number.isFinite(w)||w<20||w>400){msg.textContent='올바른 날짜와 몸무게를 입력하세요.';return}const old=data.find(x=>x.date===d);if(old)old.weight=w;else data.push({date:d,weight:w});save();msg.textContent=old?'기록을 수정했습니다.':'기록했습니다.';weight.value='';render()};
$('#clear').onclick=()=>{if(data.length&&confirm('모든 기록을 삭제할까요?')){data=[];save();render();msg.textContent='모든 기록을 삭제했습니다.'}};
$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(sorted(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`weight-backup-${date.value}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
$('#import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const incoming=JSON.parse(await f.text());if(!Array.isArray(incoming)||incoming.some(x=>!x.date||!Number.isFinite(Number(x.weight))))throw 0;data=incoming.map(x=>({date:String(x.date),weight:Number(x.weight)}));save();render();msg.textContent='백업을 불러왔습니다.'}catch(err){msg.textContent='올바른 백업 파일이 아닙니다.'}e.target.value=''};render();
</script></body></html>
